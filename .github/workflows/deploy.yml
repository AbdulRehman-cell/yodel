name: Build, Validate, and Deploy to Render

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Validation
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: local/static-portfolio:latest
          outputs: type=docker,dest=/tmp/image.tar

      - name: Scan Image with Anchore Grype (Security Check)
        uses: anchore/scan-action@v3
        with:
          image: local/static-portfolio:latest
          fail-build: false
          severity-cutoff: high

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v16.0.0
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}